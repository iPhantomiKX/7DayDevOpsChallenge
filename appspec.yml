version: 0.0
os: linux
files:
  - source: /Web-Project/target/nextwork-web-project.war
    destination: /usr/share/tomcat/webapps/
hooks:
  BeforeInstall:
    - location: Web-Project/scripts/install_dependencies.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: Web-Project/scripts/start_server.sh
      timeout: 300
      runas: root
  ApplicationStop:
    - location: Web-Project/scripts/stop_server.sh
      timeout: 300
      runas: root

